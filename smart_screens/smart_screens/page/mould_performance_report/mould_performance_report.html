<div class="mould-performance-report">
    <style>
        .performance-metrics {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
            padding: 15px;
        }

        .metric-card {
            background: white;
            border-radius: 8px;
            padding: 15px;
            min-width: 200px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex: 1;
        }

        .metric-value {
            font-size: 24px;
            font-weight: bold;
            color: var(--primary);
        }

        .metric-label {
            color: var(--text-muted);
            margin-top: 5px;
        }

        .metric-info {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-color);
        }

        .performance-charts {
            background: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .performance-details {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .frappe-chart .chart-container {
            height: 100% !important;
        }

        .report-table {
            padding: 15px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-top: 20px;
        }

        .mould-performance-table {
            width: 100%;
            border-collapse: collapse;
        }

        /* Header styling */
        .mould-performance-table th {
            background-color: var(--bg-gray);
            position: sticky;
            top: 0;
            z-index: 1;
            white-space: nowrap;
            padding: 10px;
            text-align: center;
            vertical-align: middle;
        }

        /* Column header specific styles */
        .mould-performance-table th.historical-col {
            background-color: #f9ebea;
            color: #922b21;
        }

        .mould-performance-table th.month-col {
            background-color: #ebf5fb;
            color: #2874a6;
        }

        .mould-performance-table th.total-col {
            background-color: #eafaf1;
            color: #1e8449;
        }

        /* Cell styling */
        .mould-performance-table td {
            white-space: nowrap;
            padding: 8px !important;
        }

        .text-right {
            text-align: right;
        }

        /* Cell specific styling */
        .mould-performance-table .historical-data {
            background-color: #f2d7d5;
        }

        .mould-performance-table .monthly-data {
            background-color: #d4e6f1;
        }

        .mould-performance-table .total-data {
            background-color: #d5f5e3;
        }

        /* Value intensity */
        .low-value {
            opacity: 0.7;
        }

        .medium-value {
            opacity: 0.85;
        }

        .high-value {
            opacity: 1;
            font-weight: bold;
        }

        /* Row hover effect */
        .mould-performance-table tr:hover {
            background-color: #f8f9fa;
        }

        /* Clickable cells */
        .mould-cell, .month-cell {
            cursor: pointer;
        }

        .mould-cell:hover {
            text-decoration: underline;
            color: var(--primary);
        }

        .month-cell:hover {
            font-weight: bold;
            color: var(--primary);
        }

        /* Dialog styling */
        .mould-detail-dialog h4 {
            margin-top: 20px;
            margin-bottom: 10px;
            font-weight: bold;
            color: var(--text-color);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
        }

        .mould-spec-section table th {
            background-color: var(--bg-gray);
            width: 20%;
        }

        .mould-performance-section table th.historical-header {
            background-color: #f9ebea;
        }

        .mould-performance-section table th.total-header {
            background-color: #eafaf1;
        }

        .monthly-performance-chart {
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .table-responsive {
                overflow-x: auto;
            }
        }
    </style>

    <div class="performance-metrics"></div>
    <div class="performance-charts"></div>
    <div class="performance-details"></div>
    <div class="report-table"></div>
</div>
